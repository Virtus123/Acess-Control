<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>MAM Control - Admin Revenda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .admin-header h1 {
            margin: 0;
            font-size: 2rem;
        }
        
        .admin-header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0;
        }
        
        .tab-btn {
            padding: 15px 30px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #64748b;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-btn:hover {
            color: #f5576c;
        }
        
        .tab-btn.active {
            color: #f5576c;
            border-bottom-color: #f5576c;
        }
        
        .tab-content {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #374151;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245,87,108,0.1);
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #f5576c;
            color: white;
        }
        
        .btn-primary:hover {
            background: #e04658;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.875rem;
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        
        th {
            background: #f9fafb;
            font-weight: 600;
            color: #374151;
        }
        
        tr:hover {
            background: #f9fafb;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-active {
            background: #d1fae5;
            color: #065f46;
        }
        
        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            margin: 0;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #d1d5db;
        }
        
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #111827;
        }
        
        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 2rem;
            margin: 0;
            color: #f5576c;
        }
        
        .stat-card p {
            margin: 5px 0 0 0;
            color: #6b7280;
        }
        
        .access-base-btn {
            background: #8b5cf6;
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .access-base-btn:hover { background: #7c3aed; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .search-bar {
            display: flex; gap: 10px; flex-wrap: wrap;
            margin-bottom: 20px; padding: 15px;
            background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;
        }
        .search-bar input {
            padding: 8px 12px; border: 1px solid #d1d5db;
            border-radius: 6px; font-size: 0.9rem; min-width: 160px; flex: 1;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1><i class="fas fa-store"></i> Admin Revenda</h1>
                <p>Gerencie suas bases (tenants)</p>
            </div>
            <button class="btn btn-danger" onclick="logout()" style="padding: 10px 20px;">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>
        
        <button class="btn access-base-btn" onclick="accessBase()">
            <i class="fas fa-external-link-alt"></i> Acessar Base de Testes
        </button>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('bases')">
                <i class="fas fa-building"></i> Bases (Tenants)
            </button>
            <button class="tab-btn" onclick="switchTab('configuracoes')">
                <i class="fas fa-cog"></i> Configurações
            </button>
        </div>
        
        <!-- Tab Bases -->
        <div id="bases" class="tab-content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 class="section-title">Suas Bases</h2>
                <button class="btn btn-primary" onclick="openBaseModal()">
                    <i class="fas fa-plus"></i> Nova Base
                </button>
            </div>

            <!-- Barra de busca -->
            <div class="search-bar">
                <input type="text" id="filter-base-id" placeholder="🔍 Tenant ID" oninput="filterBases()">
                <input type="text" id="filter-base-cnpj" placeholder="🔍 CNPJ" oninput="filterBases()">
                <input type="text" id="filter-base-razao" placeholder="🔍 Razão Social" oninput="filterBases()">
                <button class="btn btn-secondary btn-sm" onclick="clearBaseFilters()"><i class="fas fa-times"></i> Limpar</button>
            </div>

            <div class="stats-grid" id="base-stats"></div>
            
            <div class="table-container">
                <table id="bases-table">
                    <thead>
                        <tr>
                            <th>Tenant ID</th>
                            <th>Empresa</th>
                            <th>CNPJ</th>
                            <th>Admin</th>
                            <th>Pessoas</th>
                            <th>Equip.</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="bases-tbody">
                        <tr><td colspan="8" class="empty-state"><i class="fas fa-building"></i><p>Carregando bases...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Tab Configurações -->
        <div id="configuracoes" class="tab-content">
            <h2 class="section-title">Configurações da Revenda</h2>
            
            <div class="card">
                <h3>Alterar Senha</h3>
                <form id="password-form">
                    <div class="form-group">
                        <label>Senha Atual</label>
                        <input type="password" id="current-password" required>
                    </div>
                    <div class="form-group">
                        <label>Nova Senha</label>
                        <input type="password" id="new-password" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmar Nova Senha</label>
                        <input type="password" id="confirm-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Alterar Senha</button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Modal Nova Base -->
    <div id="base-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nova Base (Tenant)</h2>
                <button class="modal-close" onclick="closeBaseModal()">&times;</button>
            </div>
            <form id="base-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tenant ID</label>
                        <input type="text" id="tenant-id" required placeholder="ex: empresa123">
                    </div>
                    <div class="form-group">
                        <label>Nome da Empresa</label>
                        <input type="text" id="tenant-company-name" required>
                    </div>
                    <div class="form-group">
                        <label>CNPJ</label>
                        <input type="text" id="tenant-cnpj" required>
                    </div>
                    <div class="form-group">
                        <label>Email Admin</label>
                        <input type="email" id="tenant-admin-email" required>
                    </div>
                    <div class="form-group">
                        <label>Senha Admin</label>
                        <input type="password" id="tenant-admin-password" required>
                    </div>
                    <div class="form-group">
                        <label>Nome Admin</label>
                        <input type="text" id="tenant-admin-name" required>
                    </div>
                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="text" id="tenant-phone">
                    </div>
                    <div class="form-group">
                        <label>Cidade</label>
                        <input type="text" id="tenant-city">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <input type="text" id="tenant-state">
                    </div>
                </div>
                
                <!-- Limites da Base -->
                <div class="form-section" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0;">
                    <h4 style="margin-bottom: 15px; color: #1e293b;"><i class="fas fa-layer-group"></i> Limites de Cadastro</h4>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Limite de Pessoas</label>
                            <input type="number" id="tenant-max-pessoas" value="1000" min="1">
                            <small style="color: #64748b;">Quantidade máxima de pessoas</small>
                        </div>
                        <div class="form-group">
                            <label>Limite de Equipamentos</label>
                            <input type="number" id="tenant-max-equipamentos" value="50" min="1">
                            <small style="color: #64748b;">Quantidade máxima de equipamentos</small>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Criar Base</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script>
        const API_URL = '';
        const currentTenant = localStorage.getItem('mamcontrol_tenant');
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
            
            if (tabId === 'bases') loadBases();
        }
        
        function accessBase() {
            // Redireciona para o sistema usando o tenant atual para testes
            window.location.href = './dashboard.html';
        }
        
        let _allBases = [];

        async function loadBases() {
            const tbody = document.getElementById('bases-tbody');
            const token = localStorage.getItem('mamcontrol_accessToken');
            try {
                const response = await fetch(`${API_URL}/api/admin/revenda/tenants`, {
                    headers: {
                        'X-Tenant-ID': currentTenant,
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                if (data.success) {
                    _allBases = data.data;
                    renderBases(_allBases);
                } else {
                    tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-building"></i><p>Nenhuma base encontrada</p></td></tr>`;
                }
            } catch (e) {
                console.error('Erro ao carregar bases:', e);
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-building"></i><p>Erro ao carregar bases</p></td></tr>`;
            }
        }

        function renderBases(list) {
            const tbody = document.getElementById('bases-tbody');
            if (!list.length) {
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-building"></i><p>Nenhuma base encontrada</p></td></tr>`;
                return;
            }
            tbody.innerHTML = list.map(t => `
                <tr>
                    <td><strong>${t.tenant_id}</strong></td>
                    <td>${t.company_name}</td>
                    <td>${t.cnpj || '-'}</td>
                    <td>${t.admin_email}</td>
                    <td>${t.pessoas_count || 0}/${t.max_pessoas || 1000}</td>
                    <td>${t.equipamentos_count || 0}/${t.max_equipamentos || 50}</td>
                    <td><span class="badge ${t.status === 'active' ? 'badge-active' : 'badge-inactive'}">${t.status === 'active' ? 'Ativo' : 'Bloqueado'}</span></td>
                    <td class="actions">
                        <button class="btn btn-primary btn-sm" onclick="accessTenant('${t.tenant_id}')" title="Acessar Base">
                            <i class="fas fa-external-link-alt"></i>
                        </button>
                        <button class="btn btn-warning btn-sm" onclick="openEditBaseModal('${t.tenant_id}','${(t.company_name||'').replace(/'/g,"\\&apos;")}','${t.cnpj||''}',${t.max_pessoas||1000},${t.max_equipamentos||50})" title="Editar">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="resetBasePassword('${t.tenant_id}')" title="Resetar Senha">
                            <i class="fas fa-key"></i>
                        </button>
                        <button class="btn ${t.status === 'active' ? 'btn-danger' : 'btn-success'} btn-sm" onclick="blockBase('${t.tenant_id}','${t.status}')" title="${t.status === 'active' ? 'Bloquear' : 'Desbloquear'}">
                            <i class="fas ${t.status === 'active' ? 'fa-ban' : 'fa-check'}"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function filterBases() {
            const fId = document.getElementById('filter-base-id').value.toLowerCase();
            const fCnpj = document.getElementById('filter-base-cnpj').value.toLowerCase();
            const fRazao = document.getElementById('filter-base-razao').value.toLowerCase();
            renderBases(_allBases.filter(t =>
                (!fId || t.tenant_id.toLowerCase().includes(fId)) &&
                (!fCnpj || (t.cnpj||'').toLowerCase().includes(fCnpj)) &&
                (!fRazao || (t.company_name||'').toLowerCase().includes(fRazao))
            ));
        }

        function clearBaseFilters() {
            ['filter-base-id','filter-base-cnpj','filter-base-razao'].forEach(id => document.getElementById(id).value = '');
            renderBases(_allBases);
        }

        async function blockBase(tenantId, currentStatus) {
            const isActive = currentStatus === 'active';
            const action = isActive ? 'bloquear' : 'desbloquear';
            if (!confirm(`Tem certeza que deseja ${action} esta base?`)) return;
            const token = localStorage.getItem('mamcontrol_accessToken');
            try {
                const res = await fetch(`${API_URL}/api/admin/tenants/${tenantId}/toggle-status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ active: isActive ? 0 : 1 })
                });
                const data = await res.json();
                if (data.success) { alert(`Base ${action}da!`); loadBases(); }
                else alert('Erro: ' + data.message);
            } catch (e) { alert('Erro: ' + e.message); }
        }

        async function resetBasePassword(tenantId) {
            if (!confirm('Deseja resetar a senha do admin desta base?')) return;
            const token = localStorage.getItem('mamcontrol_accessToken');
            try {
                const res = await fetch(`${API_URL}/api/admin/tenants/${tenantId}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({})
                });
                const data = await res.json();
                if (data.success) alert('Senha resetada!\nNova senha: ' + (data.data?.temporary_password || 'Enviada por email'));
                else alert('Erro: ' + data.message);
            } catch (e) { alert('Erro: ' + e.message); }
        }

        // Edit base modal
        let _editingBaseId = null;
        function openEditBaseModal(tenantId, companyName, cnpj, maxPessoas, maxEquipamentos) {
            _editingBaseId = tenantId;
            document.getElementById('edit-base-id-display').textContent = tenantId;
            document.getElementById('edit-base-company-name').value = companyName || '';
            document.getElementById('edit-base-cnpj').value = cnpj || '';
            document.getElementById('edit-base-max-pessoas').value = maxPessoas || 1000;
            document.getElementById('edit-base-max-equipamentos').value = maxEquipamentos || 50;
            document.getElementById('edit-base-modal').classList.add('active');
        }
        function closeEditBaseModal() {
            document.getElementById('edit-base-modal').classList.remove('active');
            _editingBaseId = null;
        }

        document.getElementById('base-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('mamcontrol_accessToken');
            const tenantData = {
                tenant_id: document.getElementById('tenant-id').value,
                company_name: document.getElementById('tenant-company-name').value,
                cnpj: document.getElementById('tenant-cnpj').value,
                admin_email: document.getElementById('tenant-admin-email').value,
                admin_password: document.getElementById('tenant-admin-password').value,
                admin_name: document.getElementById('tenant-admin-name').value,
                phone: document.getElementById('tenant-phone').value,
                city: document.getElementById('tenant-city').value,
                state: document.getElementById('tenant-state').value,
                max_pessoas: parseInt(document.getElementById('tenant-max-pessoas').value) || 1000,
                max_equipamentos: parseInt(document.getElementById('tenant-max-equipamentos').value) || 50
            };
            try {
                const response = await fetch(`${API_URL}/api/admin/tenants`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Tenant-ID': currentTenant,
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(tenantData)
                });
                const data = await response.json();
                if (data.success) { alert('Base criada com sucesso!'); closeBaseModal(); loadBases(); }
                else alert('Erro: ' + data.message);
            } catch (e) { alert('Erro ao criar base: ' + e.message); }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const editForm = document.getElementById('edit-base-form');
            if (editForm) editForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!_editingBaseId) return;
                const token = localStorage.getItem('mamcontrol_accessToken');
                const body = {
                    company_name: document.getElementById('edit-base-company-name').value,
                    cnpj: document.getElementById('edit-base-cnpj').value,
                    max_pessoas: parseInt(document.getElementById('edit-base-max-pessoas').value) || 1000,
                    max_equipamentos: parseInt(document.getElementById('edit-base-max-equipamentos').value) || 50
                };
                try {
                    const res = await fetch(`${API_URL}/api/admin/tenants/${_editingBaseId}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    if (data.success) { alert('Base atualizada!'); closeEditBaseModal(); loadBases(); }
                    else alert('Erro: ' + data.message);
                } catch (err) { alert('Erro: ' + err.message); }
            });
        });
        
        function openBaseModal() { document.getElementById('base-modal').classList.add('active'); }
        function closeBaseModal() { document.getElementById('base-modal').classList.remove('active'); }
        async function accessTenant(tenantId) {
            const token = localStorage.getItem('mamcontrol_accessToken');
            try {
                const response = await fetch(`${API_URL}/api/admin/tenants/${tenantId}/impersonate`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    // Prepara o handshake para a nova aba
                    localStorage.setItem('mamcontrol_impersonate_token', data.data.accessToken);
                    localStorage.setItem('mamcontrol_impersonate_tenant', tenantId);
                    
                    // Abre o dashboard em uma nova aba
                    window.open('./dashboard.html', '_blank');
                    console.log(`[Impersonation] Iniciando acesso à base ${tenantId}`);
                } else {
                    alert('Erro ao acessar base: ' + data.message);
                }
            } catch (e) {
                alert('Erro ao acessar base: ' + e.message);
            }
        }
        loadBases();
        function logout() { 
            localStorage.clear(); 
            sessionStorage.clear();
            window.location.href = 'index.html'; 
        }
    </script>

    <!-- Modal Editar Base -->
    <div id="edit-base-modal" class="modal">
        <div class="modal-content" style="max-width: 480px;">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Editar Base — <span id="edit-base-id-display"></span></h2>
                <button class="modal-close" onclick="closeEditBaseModal()">&times;</button>
            </div>
            <form id="edit-base-form">
                <div class="form-group">
                    <label>Razão Social</label>
                    <input type="text" id="edit-base-company-name" placeholder="Nome da empresa">
                </div>
                <div class="form-group">
                    <label>CNPJ</label>
                    <input type="text" id="edit-base-cnpj" placeholder="00.000.000/0000-00">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Limite de Pessoas</label>
                        <input type="number" id="edit-base-max-pessoas" min="1">
                    </div>
                    <div class="form-group">
                        <label>Limite de Equipamentos</label>
                        <input type="number" id="edit-base-max-equipamentos" min="1">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 10px; width: 100%;">
                    <i class="fas fa-save"></i> Salvar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
