<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Acess Control - Recuperar Senha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #6a11cb;
            --bg-dark: #0f0c29;
            --glass: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0c29;
            color: var(--text);
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px;
        }

        /* Animação Background com Círculos */
        .bg-animate {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent), var(--primary));
            filter: blur(80px);
            animation: move 20s infinite alternate;
            opacity: 0.3;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        /* Container Principal */
        .recovery-screen {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 500px;
            max-width: 100%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
            padding: 40px;
        }

        /* Header */
        .recovery-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .recovery-header .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .recovery-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ffffff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .recovery-header p {
            font-size: 0.95rem;
            color: #f0f0f0;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        /* Botão Voltar */
        .back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .back-button:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: rgba(0, 210, 255, 0.3);
            transform: translateY(-2px);
        }

        .back-button i {
            color: var(--primary);
        }

        /* Steps */
        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            position: relative;
        }

        .steps::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%);
            z-index: 1;
        }

        .step {
            position: relative;
            z-index: 2;
            background: var(--bg-dark);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .step.active {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border-color: transparent;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        .step.completed {
            background: var(--success);
            border-color: transparent;
        }

        .step-label {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #f0f0f0;
            white-space: nowrap;
        }

        /* Formulários */
        .form-container {
            transition: all 0.3s ease;
        }

        .form-step {
            display: block;
        }

        .form-step.hidden {
            display: none;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 8px;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .input-group input:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 210, 255, 0.5);
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.95rem;
        }

        /* Input de código */
        .code-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .code-input {
            width: 60px;
            height: 70px;
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        .code-input:focus {
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
        }

        /* Timer */
        .timer {
            text-align: center;
            margin: 15px 0;
            font-size: 0.9rem;
            color: #f0f0f0;
        }

        .timer i {
            color: var(--primary);
            margin-right: 5px;
        }

        .resend-link {
            text-align: center;
            margin-top: 10px;
        }

        .resend-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .resend-link a:hover {
            color: white;
            text-decoration: underline;
        }

        .resend-link a.disabled {
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            cursor: not-allowed;
        }

        /* Botão principal */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--accent), var(--primary));
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            font-size: 1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(106, 17, 203, 0.5);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-submit i {
            margin-right: 8px;
        }

        /* Mensagens */
        .alert {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin: 20px 0;
            backdrop-filter: blur(5px);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #d1fae5;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fee2e2;
        }

        .alert-info {
            background: rgba(0, 210, 255, 0.2);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: #e0f2fe;
        }

        .alert i {
            font-size: 1.1rem;
        }

        .hidden {
            display: none !important;
        }

        /* Loading state */
        .btn-submit.loading {
            position: relative;
            color: transparent;
        }

        .btn-submit.loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Password strength */
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }

        .strength-bar.weak {
            width: 33.33%;
            background: var(--error);
        }

        .strength-bar.medium {
            width: 66.66%;
            background: #f59e0b;
        }

        .strength-bar.strong {
            width: 100%;
            background: var(--success);
        }

        .password-match {
            font-size: 0.8rem;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .match-success {
            color: var(--success);
        }

        .match-error {
            color: var(--error);
        }

        /* Footer */
        .recovery-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .recovery-header h1 {
                font-size: 1.6rem;
            }

            .back-button {
                top: 15px;
                left: 15px;
                padding: 8px 12px;
                font-size: 0.8rem;
            }

            .code-inputs {
                gap: 5px;
            }

            .code-input {
                width: 45px;
                height: 55px;
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .code-input {
                width: 40px;
                height: 50px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animate">
        <div class="circle" style="width: 400px; height: 400px; top: -100px; left: -100px;"></div>
        <div class="circle" style="width: 300px; height: 300px; bottom: -50px; right: -50px; animation-delay: -5s;"></div>
    </div>

    <a href="javascript:history.back()" class="back-button">
        <i class="fas fa-arrow-left"></i> Voltar
    </a>

    <div class="recovery-screen">
        <div class="container">
            <div class="recovery-header">
                <div class="logo">
                    <i class="fas fa-key"></i>
                </div>
                <h1>Recuperar Senha</h1>
                <p>Recupere o acesso à sua conta</p>
            </div>

            <!-- Steps -->
            <div class="steps">
                <div class="step active" id="step1">
                    1
                    <span class="step-label">Email</span>
                </div>
                <div class="step" id="step2">
                    2
                    <span class="step-label">Código</span>
                </div>
                <div class="step" id="step3">
                    3
                    <span class="step-label">Nova Senha</span>
                </div>
            </div>

            <!-- Alertas -->
            <div id="alert-success" class="alert alert-success hidden">
                <i class="fas fa-check-circle"></i>
                <span id="success-message"></span>
            </div>

            <div id="alert-error" class="alert alert-error hidden">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-message"></span>
            </div>

            <div id="alert-info" class="alert alert-info hidden">
                <i class="fas fa-info-circle"></i>
                <span id="info-message"></span>
            </div>

            <!-- Step 1: Email + Tenant -->
            <div id="step1-form" class="form-step">
                <form onsubmit="enviarEmail(event)">
                    <div class="input-group">
                        <label>Organização (Tenant ID)</label>
                        <input type="text" id="tenant-id" placeholder="Ex: default, acesscontrol" required>
                    </div>

                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail" required>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-enviar-email">
                        <i class="fas fa-paper-plane"></i>
                        Enviar Código
                    </button>
                </form>
            </div>

            <!-- Step 2: Código -->
            <div id="step2-form" class="form-step hidden">
                <form onsubmit="verificarCodigo(event)">
                    <div class="input-group">
                        <label>Código de Verificação</label>
                        <div class="code-inputs">
                            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" onkeyup="moverProximo(this, 0)" id="code1" required>
                            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" onkeyup="moverProximo(this, 1)" id="code2" required>
                            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" onkeyup="moverProximo(this, 2)" id="code3" required>
                            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" onkeyup="moverProximo(this, 3)" id="code4" required>
                            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" onkeyup="moverProximo(this, 4)" id="code5" required>
                            <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" onkeyup="moverProximo(this, 5)" id="code6" required>
                        </div>
                    </div>

                    <div class="timer" id="timer">
                        <i class="fas fa-clock"></i>
                        <span id="timer-display">05:00</span>
                    </div>

                    <div class="resend-link">
                        <a href="#" id="resend-link" onclick="reenviarCodigo(event)" class="disabled">Reenviar código</a>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-verificar">
                        <i class="fas fa-check"></i>
                        Verificar Código
                    </button>
                </form>
            </div>

            <!-- Step 3: Nova Senha -->
            <div id="step3-form" class="form-step hidden">
                <form onsubmit="alterarSenha(event)">
                    <div class="input-group">
                        <label>Nova Senha</label>
                        <input type="password" id="nova-senha" placeholder="Digite sua nova senha" onkeyup="verificarForcaSenha()" required>
                        <div class="password-strength">
                            <div class="strength-bar" id="strength-bar"></div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Confirmar Nova Senha</label>
                        <input type="password" id="confirmar-senha" placeholder="Confirme sua nova senha" onkeyup="verificarMatch()" required>
                        <div class="password-match" id="password-match">
                            <i class="fas fa-circle"></i>
                            <span>As senhas não coincidem</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-alterar">
                        <i class="fas fa-save"></i>
                        Alterar Senha
                    </button>
                </form>
            </div>

            <div class="recovery-footer">
                <i class="fas fa-shield-alt"></i>
                <span>Seus dados estão seguros</span>
            </div>
        </div>
    </div>

    <script>
        // Variáveis globais
        let codigoGerado = '123456'; // Em produção, isso viria do backend
        let emailUsuario = '';
        let tenantIdUsuario = '';
        let tempToken = '';
        let timerInterval;
        let tempoRestante = 300; // 5 minutos em segundos

        // Configuração da API
        const API_URL = '/api';

        // Funções para os steps
        function mostrarStep(step) {
            // Atualizar steps
            document.getElementById('step1').classList.remove('active', 'completed');
            document.getElementById('step2').classList.remove('active', 'completed');
            document.getElementById('step3').classList.remove('active', 'completed');

            if (step === 1) {
                document.getElementById('step1').classList.add('active');
                document.getElementById('step1-form').classList.remove('hidden');
                document.getElementById('step2-form').classList.add('hidden');
                document.getElementById('step3-form').classList.add('hidden');
            } else if (step === 2) {
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step2').classList.add('active');
                document.getElementById('step1-form').classList.add('hidden');
                document.getElementById('step2-form').classList.remove('hidden');
                document.getElementById('step3-form').classList.add('hidden');
                
                // Iniciar timer
                iniciarTimer();
            } else if (step === 3) {
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step2').classList.add('completed');
                document.getElementById('step3').classList.add('active');
                document.getElementById('step1-form').classList.add('hidden');
                document.getElementById('step2-form').classList.add('hidden');
                document.getElementById('step3-form').classList.remove('hidden');
            }
        }

        // Step 1: Enviar email
        async function enviarEmail(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const tenantId = document.getElementById('tenant-id').value.trim();
            
            if (!tenantId) {
                mostrarAlerta('error', 'Digite o ID da sua organização');
                return;
            }
            
            if (!email) {
                mostrarAlerta('error', 'Digite seu e-mail');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                mostrarAlerta('error', 'Digite um e-mail válido');
                return;
            }

            emailUsuario = email;
            tenantIdUsuario = tenantId;
            
            // Chamar API para enviar código
            setLoading('btn-enviar-email', true);
            mostrarAlerta('info', 'Enviando código para seu e-mail...');

            try {
                const response = await fetch(`${API_URL}/password-reset/esqueci-senha`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Tenant-ID': tenantId
                    },
                    body: JSON.stringify({ email, tenantId })
                });

                const data = await response.json();
                
                setLoading('btn-enviar-email', false);

                if (data.success) {
                    // Sempre mostrar mensagem genérica por segurança
                    mostrarAlerta('success', data.message || 'Código enviado para seu e-mail');
                    
                    // Salvar tenant no localStorage para uso futuro
                    localStorage.setItem('acesscontrol_tenant', tenantId);
                    
                    // Avançar para step 2
                    mostrarStep(2);
                } else {
                    mostrarAlerta('error', data.message || 'Erro ao enviar código');
                }
            } catch (error) {
                setLoading('btn-enviar-email', false);
                console.error('Erro ao enviar email:', error);
                mostrarAlerta('error', 'Erro de conexão. Tente novamente.');
            }
        }

        // Step 2: Verificar código
        async function verificarCodigo(event) {
            event.preventDefault();

            const code1 = document.getElementById('code1').value;
            const code2 = document.getElementById('code2').value;
            const code3 = document.getElementById('code3').value;
            const code4 = document.getElementById('code4').value;
            const code5 = document.getElementById('code5').value;
            const code6 = document.getElementById('code6').value;

            const codigoDigitado = code1 + code2 + code3 + code4 + code5 + code6;

            if (codigoDigitado.length !== 6) {
                mostrarAlerta('error', 'Digite o código completo');
                return;
            }

            setLoading('btn-verificar', true);

            try {
                const response = await fetch(`${API_URL}/password-reset/verificar-codigo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Tenant-ID': tenantIdUsuario
                    },
                    body: JSON.stringify({ 
                        email: emailUsuario, 
                        code: codigoDigitado,
                        tenantId: tenantIdUsuario
                    })
                });

                const data = await response.json();
                
                setLoading('btn-verificar', false);

                if (data.success) {
                    tempToken = data.tempToken;
                    mostrarAlerta('success', 'Código verificado com sucesso');
                    pararTimer();
                    mostrarStep(3);
                } else {
                    mostrarAlerta('error', data.message || 'Código inválido');
                    
                    // Limpar campos
                    document.querySelectorAll('.code-input').forEach(input => input.value = '');
                    document.getElementById('code1').focus();
                }
            } catch (error) {
                setLoading('btn-verificar', false);
                console.error('Erro ao verificar código:', error);
                mostrarAlerta('error', 'Erro de conexão. Tente novamente.');
            }
        }

        // Step 3: Alterar senha
        async function alterarSenha(event) {
            event.preventDefault();

            const novaSenha = document.getElementById('nova-senha').value;
            const confirmarSenha = document.getElementById('confirmar-senha').value;

            if (novaSenha.length < 6) {
                mostrarAlerta('error', 'A senha deve ter pelo menos 6 caracteres');
                return;
            }

            if (novaSenha !== confirmarSenha) {
                mostrarAlerta('error', 'As senhas não coincidem');
                return;
            }

            setLoading('btn-alterar', true);

            try {
                const response = await fetch(`${API_URL}/password-reset/nova-senha`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Tenant-ID': tenantIdUsuario
                    },
                    body: JSON.stringify({ 
                        email: emailUsuario, 
                        novaSenha: novaSenha,
                        tempToken: tempToken,
                        tenantId: tenantIdUsuario
                    })
                });

                const data = await response.json();
                
                setLoading('btn-alterar', false);

                if (data.success) {
                    mostrarAlerta('success', 'Senha alterada com sucesso! Redirecionando...');
                    
                    // Redirecionar para o login após 2 segundos
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    mostrarAlerta('error', data.message || 'Erro ao alterar senha');
                }
            } catch (error) {
                setLoading('btn-alterar', false);
                console.error('Erro ao alterar senha:', error);
                mostrarAlerta('error', 'Erro de conexão. Tente novamente.');
            }
        }

        // Timer
        function iniciarTimer() {
            tempoRestante = 300;
            atualizarTimer();
            
            timerInterval = setInterval(() => {
                tempoRestante--;
                atualizarTimer();

                if (tempoRestante <= 0) {
                    pararTimer();
                    document.getElementById('resend-link').classList.remove('disabled');
                }
            }, 1000);
        }

        function pararTimer() {
            clearInterval(timerInterval);
        }

        function atualizarTimer() {
            const minutos = Math.floor(tempoRestante / 60);
            const segundos = tempoRestante % 60;
            document.getElementById('timer-display').textContent = 
                `${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
        }

        // Reenviar código
        async function reenviarCodigo(event) {
            event.preventDefault();
            
            if (tempoRestante > 0 && tempoRestante < 300) {
                mostrarAlerta('error', 'Aguarde o tempo para reenviar');
                return;
            }

            mostrarAlerta('info', 'Reenviando código...');
            
            try {
                const response = await fetch(`${API_URL}/password-reset/esqueci-senha`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Tenant-ID': tenantIdUsuario
                    },
                    body: JSON.stringify({ 
                        email: emailUsuario, 
                        tenantId: tenantIdUsuario
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    mostrarAlerta('success', data.message || 'Código reenviado com sucesso');
                    
                    document.getElementById('resend-link').classList.add('disabled');
                    iniciarTimer();
                } else {
                    mostrarAlerta('error', data.message || 'Erro ao reenviar código');
                }
            } catch (error) {
                console.error('Erro ao reenviar código:', error);
                mostrarAlerta('error', 'Erro de conexão. Tente novamente.');
            }
        }

        // Navegação entre inputs de código
        function moverProximo(input, index) {
            if (input.value.length === 1) {
                const next = document.getElementById(`code${index + 2}`);
                if (next) {
                    next.focus();
                }
            }
        }

        // Verificar força da senha
        function verificarForcaSenha() {
            const senha = document.getElementById('nova-senha').value;
            const bar = document.getElementById('strength-bar');
            
            bar.classList.remove('weak', 'medium', 'strong');
            
            if (senha.length === 0) {
                bar.style.width = '0';
                return;
            }

            let forca = 0;
            
            // Critérios de força
            if (senha.length >= 8) forca++;
            if (senha.match(/[a-z]/)) forca++;
            if (senha.match(/[A-Z]/)) forca++;
            if (senha.match(/[0-9]/)) forca++;
            if (senha.match(/[^a-zA-Z0-9]/)) forca++;

            if (forca <= 2) {
                bar.classList.add('weak');
            } else if (forca <= 4) {
                bar.classList.add('medium');
            } else {
                bar.classList.add('strong');
            }

            verificarMatch();
        }

        // Verificar se as senhas coincidem
        function verificarMatch() {
            const senha = document.getElementById('nova-senha').value;
            const confirmar = document.getElementById('confirmar-senha').value;
            const matchDiv = document.getElementById('password-match');
            const icon = matchDiv.querySelector('i');
            const text = matchDiv.querySelector('span');

            if (confirmar.length === 0) {
                matchDiv.style.display = 'none';
                return;
            }

            matchDiv.style.display = 'flex';

            if (senha === confirmar) {
                icon.className = 'fas fa-check-circle';
                icon.style.color = '#10b981';
                text.textContent = 'As senhas coincidem';
                text.style.color = '#10b981';
            } else {
                icon.className = 'fas fa-exclamation-circle';
                icon.style.color = '#ef4444';
                text.textContent = 'As senhas não coincidem';
                text.style.color = '#ef4444';
            }
        }

        // Funções auxiliares
        function mostrarAlerta(tipo, mensagem) {
            document.getElementById('alert-success').classList.add('hidden');
            document.getElementById('alert-error').classList.add('hidden');
            document.getElementById('alert-info').classList.add('hidden');
            
            if (tipo === 'success') {
                document.getElementById('success-message').textContent = mensagem;
                document.getElementById('alert-success').classList.remove('hidden');
            } else if (tipo === 'error') {
                document.getElementById('error-message').textContent = mensagem;
                document.getElementById('alert-error').classList.remove('hidden');
            } else if (tipo === 'info') {
                document.getElementById('info-message').textContent = mensagem;
                document.getElementById('alert-info').classList.remove('hidden');
            }
        }

        function setLoading(buttonId, isLoading) {
            const button = document.getElementById(buttonId);
            if (isLoading) {
                button.classList.add('loading');
                button.disabled = true;
            } else {
                button.classList.remove('loading');
                button.disabled = false;
            }
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar se há tenant salvo no localStorage
            const savedTenant = localStorage.getItem('acesscontrol_tenant');
            if (savedTenant) {
                document.getElementById('tenant-id').value = savedTenant;
            }
            
            // Configurar inputs de código
            document.querySelectorAll('.code-input').forEach((input, index) => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value) {
                        const prev = document.getElementById(`code${index}`);
                        if (prev) {
                            prev.focus();
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
